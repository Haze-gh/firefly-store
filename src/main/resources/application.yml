server:
  port: 8080

spring:
  datasource:
    #url: jdbc:mysql://192.168.10.241:33066/firefly_store?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    url: jdbc:mysql://192.168.0.2:33066/firefly_store?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    # 数据库口令不写入代码库，部署时通过环境变量注入
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  servlet:
    multipart:
      max-file-size: 10GB
      max-request-size: 10GB

minio:
  endpoint: http://192.168.0.17:9000
  # MinIO 凭证不写入代码库，部署时通过环境变量注入
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket: uploads
  url-prefix: https://cdn.gxyunyun.com/uploads
  use-ssl: false

firefly:
  # 永久保存密钥（后端校验；永久文件归档到 uploads/{yyyy-MM}/ 下）
  # 不写入代码库，部署时通过环境变量注入
  permanent-key: ${FIREFLY_PERMANENT_KEY:}
